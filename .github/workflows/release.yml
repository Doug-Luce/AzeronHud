name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Plugins build against the Dalamud assemblies, which ship as a zip
      # rather than a NuGet package.
      - name: Fetch Dalamud
        run: |
          curl -sL https://goatcorp.github.io/dalamud-distrib/latest.zip -o dalamud.zip
          mkdir -p "$HOME/dalamud"
          unzip -oq dalamud.zip -d "$HOME/dalamud"
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="1.0.0.0"
          case "$(echo "$VERSION" | tr -cd . | wc -c)" in
            1) VERSION="$VERSION.0.0" ;;
            2) VERSION="$VERSION.0" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet build AzeronHud/AzeronHud.csproj -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }}

      # repo.json is what the plugin installer polls, so the version it
      # advertises has to move with the release or Dalamud won't offer it.
      - name: Update repo.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json
          entries = json.load(open("repo.json"))
          entries[0]["AssemblyVersion"] = "${{ steps.version.outputs.version }}"
          json.dump(entries, open("repo.json", "w"), indent=2)
          open("repo.json", "a").write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --quiet --cached || git commit -m "repo.json: ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Azeron HUD $GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" \
            AzeronHud/bin/Release/AzeronHud/latest.zip --clobber
